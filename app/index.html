  /* 首屏加载提示：样式内联，脚本和字体没到之前就能看到 */
  #loading { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0d1410; color: #f3e6cb; font: 16px/1.6 "Kaiti SC", "STKaiti", "KaiTi", serif; letter-spacing: .2em; transition: opacity .5s; }
  #loading i { width: 46px; height: 46px; border-radius: 12px; background: #c9a06c; box-shadow: inset 0 0 0 3px rgba(0,0,0,.12); position: relative; animation: ldw 1.4s ease-in-out infinite; }
  #loading i::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: repeating-linear-gradient(45deg, #fbf3e2 0 4px, #d2553d 4px 8px); }
  @keyframes ldw { 0%, 60%, 100% { transform: none; } 70% { transform: rotate(-7deg); } 80% { transform: rotate(6deg); } 90% { transform: rotate(-3deg); } }
  #loading.gone { opacity: 0; pointer-events: none; }
</style>
